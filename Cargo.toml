    [package]
    name = "flags-2-env-desktop-app"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "Native Rust desktop app for flags-2-env"
    repository = "https://github.com/flags-2-env/flags-2-env-desktop-app.rs"
    default-run = "flags2env-platform-desktop"

    [lib]
    name = "flags_2_env_desktop_core"
    path = "src/lib.rs"

    [[bin]]
    name = "flags2env-platform-desktop"
    path = "src/main.rs"

    [dependencies]
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"

[lints.rust]
unsafe_code = "forbid"


