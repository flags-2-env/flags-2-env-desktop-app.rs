    [package]
    name = "flags-2-env-desktop-app"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "Native Rust desktop app for flags-2-env"
    repository = "https://github.com/flags-2-env/flags-2-env-desktop-app.rs"
    default-run = "flags2env-platform-desktop"

    [lib]
    name = "flags_2_env_desktop_core"
    path = "src/lib.rs"

    [[bin]]
    name = "flags2env-platform-desktop"
    path = "src/main.rs"

    [dependencies]
next-loggers = { package = "oresoftware-next-loggers", git = "https://github.com/ores-otel/ores.otel.log.git", rev = "cf8f87506afafb56517563530c40dad1df1aedb6" }
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
wildcard_enum_match_arm = "deny"

